      max_concurrent: 1

  # PROVIDES: Quick updates for new agendas posted
  # DATA: RSS feed of newly posted agendas (lightweight polling)
  # ADVANTAGE: Faster detection of new documents than full HTML scrape
  - name: "City Council RSS"
    driver: "civic_plus_rss"
    enabled: false  # Disabled - duplicates iCalendar events
    schedule: "30 */2 * * *"  # Every 2 hours for quick updates
    params:
      base_url: "https://www.mytwinsburg.com"
      module: "agenda"
      categories:
        - "city_council"
        - "planning_commission"
        - "finance_committee"
    rate_limit:
      delay_seconds: 1
      max_concurrent: 1

  # PROVIDES: Quick updates for new calendar events
  # DATA: RSS feed of calendar events with optional full detail fetch
  # ADVANTAGE: Lightweight polling for new events
  - name: "Calendar RSS"
    driver: "civic_plus_rss"
    enabled: false  # Disabled - duplicates iCalendar events
    schedule: "0 */4 * * *"  # Every 4 hours
    params:
      base_url: "https://www.mytwinsburg.com"
      module: "calendar"
      categories:
        - "main"
        - "parks_recreation"
        - "community_events"
      fetch_full_details: true  # Fetch full descriptions and documents from event pages
    rate_limit:
      delay_seconds: 2
      max_concurrent: 1

