    rate_limit:
      delay_seconds: 2
      max_concurrent: 1

  # PROVIDES: Parks & Rec events (sports registrations, programs, activities)
  # DATA: Event titles, dates, descriptions from calendar HTML
  # SCRAPES: Calendar HTML pages (different from AgendaCenter)
  - name: "Parks & Recreation"
    driver: "civic_plus_calendar"
    enabled: false  # Disabled - duplicates iCalendar events
    schedule: "0 6 * * *"
    params:
      base_url: "https://www.mytwinsburg.com"
      calendar_ids:
        - 22  # Parks & Recreation calendar
      days_ahead: 90
      days_back: 7
    rate_limit:
      delay_seconds: 2
      max_concurrent: 1

  # PROVIDES: General community events (festivals, closures, public notices)
