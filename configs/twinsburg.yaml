      max_years: 2
    retry:
      max_attempts: 3
      backoff_seconds: 60
    rate_limit:
      delay_seconds: 2
      max_concurrent: 1

  # PROVIDES: Parks & Rec events (sports registrations, programs, activities)
  # DATA: Event titles, dates, descriptions from calendar HTML
  # SCRAPES: Calendar HTML pages (different from AgendaCenter)
  - name: "Parks & Recreation"
    driver: "civic_plus_calendar"
    enabled: false  # Disabled - duplicates iCalendar events
    schedule: "0 6 * * *"
    params:
      base_url: "https://www.mytwinsburg.com"
      calendar_ids:
        - 22  # Parks & Recreation calendar
      days_ahead: 90
      days_back: 7
    rate_limit:
      delay_seconds: 2
      max_concurrent: 1

  # PROVIDES: General community events (festivals, closures, public notices)
  # DATA: Event titles, dates, descriptions from main city calendar
  # SCRAPES: Calendar HTML pages
  - name: "Community Events"
    driver: "civic_plus_calendar"
    enabled: false  # Disabled - duplicates iCalendar events
    schedule: "0 6 * * *"
    params:
      base_url: "https://www.mytwinsburg.com"
      calendar_ids:
        - 14  # Main Calendar
      days_ahead: 90
      days_back: 7
    rate_limit:
      delay_seconds: 2
      max_concurrent: 1

  # PROVIDES: Quick updates for new agendas posted
  # DATA: RSS feed of newly posted agendas (lightweight polling)
  # ADVANTAGE: Faster detection of new documents than full HTML scrape
  - name: "City Council RSS"
    driver: "civic_plus_rss"
    enabled: false  # Disabled - duplicates iCalendar events
    schedule: "30 */2 * * *"  # Every 2 hours for quick updates
    params:
      base_url: "https://www.mytwinsburg.com"
      module: "agenda"
      categories:
        - "city_council"
        - "planning_commission"
        - "finance_committee"
    rate_limit:
      delay_seconds: 1
      max_concurrent: 1

  # PROVIDES: Quick updates for new calendar events
  # DATA: RSS feed of calendar events with optional full detail fetch
  # ADVANTAGE: Lightweight polling for new events
  - name: "Calendar RSS"
    driver: "civic_plus_rss"
    enabled: false  # Disabled - duplicates iCalendar events
    schedule: "0 */4 * * *"  # Every 4 hours
    params:
      base_url: "https://www.mytwinsburg.com"
      module: "calendar"
      categories:
        - "main"
        - "parks_recreation"
        - "community_events"
      fetch_full_details: true  # Fetch full descriptions and documents from event pages
    rate_limit:
      delay_seconds: 2
      max_concurrent: 1

  # ===========================================================================
  # ACTIVE: Non-City Sources (unique data, not duplicates)
  # ===========================================================================

  # PROVIDES: School board meetings, agendas, minutes
  # DATA: K-12 school district governance meetings
  # STATUS: Disabled - school website is slow and causes timeouts
  # UNIQUE: Only source for school district data (not on city calendar)
  - name: "School Board"
    driver: "aspnet_generic"
    enabled: false  # Temporarily disabled - site too slow, causes timeouts
    schedule: "0 */4 * * *"
    params:
      url: "https://www.twinsburg.k12.oh.us/meetingsandagendas.aspx"
    rate_limit:
      delay_seconds: 3
      max_concurrent: 1

  # PROVIDES: Library programs, events, book clubs, children's activities
  # DATA: Event titles, dates, times, descriptions, registration info
  # UNIQUE: Only source for library events (separate from city calendar)
  # EXAMPLES: Story time, summer reading, author visits, computer classes
  - name: "Public Library"
    driver: "libcal"
    schedule: "0 7 * * *"
    params:
      library_id: "twinsburglibrary"
      iid: 4446  # LibCal institutional ID
    rate_limit:
      delay_seconds: 2

  # PROVIDES: Historical society events, museum programs, heritage activities
  # DATA: RSS feed of events from historical society website
  # UNIQUE: Only source for historical/heritage events
  # EXAMPLES: Historic home tours, genealogy workshops, artifact exhibits
  - name: "Historical Society"
    driver: "rss"
    schedule: "0 8 * * *"
    params:
      feed_url: "https://twinsburghistoricalsociety.org/events/feed"
    rate_limit:
      delay_seconds: 2
      max_concurrent: 1

  # PROVIDES: City meeting recordings directly from YouTube
  # DATA: Full video recordings of city council, commissions, committees
  # UNIQUE: Direct access to meeting videos with AI summarization
  # NOTES: Videos are analyzed by Gemini for public comments, debates, tone
  - name: "City YouTube Channel"
    driver: "youtube_channel"
    enabled: true
    schedule: "0 9 * * *"
    params:
      channel_url: "https://www.youtube.com/@CityofTwinsburg/videos"
      max_videos: 100
    rate_limit:
      delay_seconds: 3
      max_concurrent: 1

  # ===========================================================================
  # DISABLED: Regional Parks (technical limitations)
  # ===========================================================================

  # WOULD PROVIDE: Summit Metroparks nature programs, hikes, events
  # EXAMPLES: Bird walks, nature photography, kayaking, holiday events
  # STATUS: Blocked by bot protection (403 Forbidden)
  # FIX NEEDED: Playwright-based driver to bypass Cloudflare/bot protection
  - name: "Summit Metroparks"
    driver: "rss"
    enabled: false  # Disabled - bot protection requires Playwright
    schedule: "0 5 * * *"
    params:
      feed_url: "https://www.summitmetroparks.org/programs-events/feed/"
    rate_limit:
      delay_seconds: 2
      max_concurrent: 1

  # WOULD PROVIDE: Cleveland Metroparks programs, nature center events
  # EXAMPLES: Zoo events, nature programs, outdoor recreation
  # STATUS: No RSS feed - uses WebTrac registration system
  # FIX NEEDED: Custom WebTrac driver with Playwright
  - name: "Cleveland Metroparks"
    driver: "rss"
    enabled: false  # Disabled - no RSS feed, needs custom WebTrac driver
    schedule: "0 5 * * *"
    params:
      feed_url: "https://www.clevelandmetroparks.com/feed/"  # Does not exist
    rate_limit:
      delay_seconds: 2
      max_concurrent: 1

  # ===========================================================================
  # City iCalendar - CATCH-ALL (runs last)
  # ===========================================================================
  # PROVIDES: Any city events not captured by specific committee sources
  # DATA: Event titles, dates/times, locations, descriptions
  # WHY LAST: Runs after committee-specific sources so events get attributed
  #           to the right source. This catches anything that slipped through.
  # FORMAT: Structured iCalendar (.ics) with precise timestamps and locations
  - name: "City Calendar (Other)"
    driver: "icalendar"
    schedule: "0 8 * * *"  # Run AFTER all AgendaCenter sources
    params:
      feed_url: "https://www.mytwinsburg.com/common/modules/iCalendar/iCalendar.aspx?catID=14&feed=calendar"
      civic_only: true  # Only include government/civic meetings, not community events
    rate_limit:
      delay_seconds: 1
      max_concurrent: 1

# =============================================================================
# PRIVATE/OPTIONAL SOURCES
# =============================================================================
# These sources require API keys or have limited public access
private_sources:
  # WOULD PROVIDE: Chamber of Commerce business events, networking, workshops
  # EXAMPLES: Business after hours, ribbon cuttings, economic development
  # STATUS: Disabled - may need verification of RSS feed availability
  - name: "Chamber of Commerce"
    driver: "rss"
    enabled: false
    schedule: "0 8 * * *"
    params:
      feed_url: "https://twinsburgchamber.com/events/feed"
    rate_limit:
      delay_seconds: 1

  # WOULD PROVIDE: Community group events from Facebook
  # EXAMPLES: Neighborhood gatherings, garage sales, community discussions
  # STATUS: Disabled - requires Facebook API authentication
  # FIX NEEDED: Facebook Graph API integration with app credentials
  - name: "Community Facebook Groups"
    driver: "facebook_events"
    enabled: false
    schedule: "0 */6 * * *"
    params:
      group_ids:
        - "twinsburg-community"
    rate_limit:
      delay_seconds: 5
      max_concurrent: 1
