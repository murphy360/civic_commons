  # PROVIDES: Parks & Recreation Commission meeting agendas, minutes
  # DATA: Parks programs, recreation facilities, trail planning
  - name: "Parks & Recreation Commission"
    driver: "civic_plus"
    enabled: true
    schedule: "0 7 * * *"
    params:
      base_url: "https://www.mytwinsburg.com"
      categories:
