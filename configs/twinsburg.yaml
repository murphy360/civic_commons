# Twinsburg, OH Configuration
# Reference implementation for Civic Commons

# =============================================================================
# IDENTITY
# =============================================================================
city_profile:
  name: "Twinsburg, OH"
  zip: "44087"
  timezone: "America/New_York"

# =============================================================================
# ASSISTANT PERSONALITY
# =============================================================================
assistant:
  name: "Wilcox"
  persona: "A helpful local historian who values accuracy and community context. Named after the Wilcox House, a historic landmark in Twinsburg."

# =============================================================================
# PUBLIC DATA SOURCES
# =============================================================================
sources:
  # ---------------------------------------------------------------------------
  # ENABLED: CivicPlus AgendaCenter sources (meeting documents)
  # ---------------------------------------------------------------------------
  # These scrape mytwinsburg.com AgendaCenter for agendas, minutes, and videos.
  # Each committee is a separate source for clear visibility in the web view.
  # Run BEFORE iCalendar so events are attributed to specific committees.
  # ---------------------------------------------------------------------------

  # PROVIDES: City Council regular meeting agendas, minutes, videos
  # DATA: Meeting documents (PDF agendas/minutes), YouTube video links
  # MEETINGS: 1st & 3rd Tuesdays at 7:00 PM
  - name: "City Council"
    driver: "civic_plus"
    enabled: true
    schedule: "0 6 * * *"
    params:
      base_url: "https://www.mytwinsburg.com"
      categories:
        - "City Council"
      max_years: 2
    retry:
      max_attempts: 3
      backoff_seconds: 60
    rate_limit:
      delay_seconds: 2
      max_concurrent: 1

  # PROVIDES: Finance Committee meeting agendas, minutes
  # DATA: Budget reviews, financial reports, appropriations
  # MEETINGS: Typically 4th Tuesday at 6:00 PM
  - name: "Finance Committee"
    driver: "civic_plus"
    enabled: true
    schedule: "0 6 * * *"
    params:
      base_url: "https://www.mytwinsburg.com"
      categories:
        - "Finance Committee"
      max_years: 2
    retry:
      max_attempts: 3
      backoff_seconds: 60
    rate_limit:
      delay_seconds: 2
      max_concurrent: 1

  # PROVIDES: Safety Committee meeting agendas, minutes
  # DATA: Police, fire, EMS matters, public safety issues
  - name: "Safety Committee"
    driver: "civic_plus"
