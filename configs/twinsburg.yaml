# Twinsburg, OH Configuration
# Reference implementation for Civic Commons

# =============================================================================
# IDENTITY
# =============================================================================
city_profile:
  name: "Twinsburg, OH"
  zip: "44087"
  timezone: "America/New_York"

# =============================================================================
# ASSISTANT PERSONALITY
# =============================================================================
assistant:
  name: "Wilcox"
  persona: "A helpful local historian who values accuracy and community context. Named after the Wilcox House, a historic landmark in Twinsburg."

# =============================================================================
# CIVICPLUS PLATFORM SETTINGS
# =============================================================================
# CivicPlus RSS feeds require category IDs (CID) that are site-specific.
# These mappings allow the RSS driver to resolve friendly names to CIDs.
civicplus:
  # Agenda Center category CIDs (for RSS feeds)
  agenda_categories:
    city_council: "City-Council-2"
    planning_commission: "Planning-Commission-4"
    architecture_review_board: "Architecture-Review-Board-5"
    board_of_zoning_appeals: "Board-of-Zoning-Appeals-3"
    parks_recreation_commission: "Parks-Recreation-Commission-7"
    finance_committee: "Finance-Committee-8"
    safety_committee: "Safety-Committee-13"
    environmental_commission: "Environmental-Commission-22"
    civil_service_commission: "Civil-Service-Commission-9"
    capital_improvement_board: "Capital-Improvement-Board-11"
    jedi_committee: "Justice-Equity-Diversity-Inclusion-Commi-23"
    public_hearing: "Public-Hearing-14"
    all: "All-0"
  
  # Calendar category CIDs (for RSS feeds)
  calendar_categories:
    main: "Main-Calendar-14"
    parks_recreation: "Parks-Recreation-22"
    fitness_center: "Fitness-Center-24"
    community_events: "Community-Events-25"
    meetings: "Meetings-23"
    around_town: "Around-Town-31"
    all: "All-calendar.xml"

# =============================================================================
# PUBLIC DATA SOURCES
# =============================================================================
sources:
  # ---------------------------------------------------------------------------
  # ENABLED: CivicPlus AgendaCenter sources (meeting documents)
  # ---------------------------------------------------------------------------
  # These scrape mytwinsburg.com AgendaCenter for agendas, minutes, and videos.
  # Each committee is a separate source for clear visibility in the web view.
  # Run BEFORE iCalendar so events are attributed to specific committees.
  # ---------------------------------------------------------------------------

  # PROVIDES: City Council regular meeting agendas, minutes, videos
  # DATA: Meeting documents (PDF agendas/minutes), YouTube video links
  # MEETINGS: 1st & 3rd Tuesdays at 7:00 PM
  - name: "City Council"
    driver: "civic_plus"
    enabled: true
    schedule: "0 6 * * *"
    params:
      base_url: "https://www.mytwinsburg.com"
      categories:
        - "City Council"
      max_years: 2
    retry:
      max_attempts: 3
      backoff_seconds: 60
    rate_limit:
      delay_seconds: 2
      max_concurrent: 1

  # PROVIDES: Finance Committee meeting agendas, minutes
  # DATA: Budget reviews, financial reports, appropriations
