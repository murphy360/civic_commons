    enabled: true
    schedule: "0 8 * * 0"  # Weekly on Sunday (historical data)
    params:
      base_url: "https://www.mytwinsburg.com"
      folder_id: 375
      folder_name: "2024 Legislation"
      document_type: "legislation"
    retry:
