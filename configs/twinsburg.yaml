  # ===========================================================================
  # City iCalendar - CATCH-ALL (runs last)
  # ===========================================================================
  # PROVIDES: Any city events not captured by specific committee sources
  # DATA: Event titles, dates/times, locations, descriptions
  # WHY LAST: Runs after committee-specific sources so events get attributed
  #           to the right source. This catches anything that slipped through.
  # FORMAT: Structured iCalendar (.ics) with precise timestamps and locations
  - name: "City Calendar (Other)"
    driver: "icalendar"
    schedule: "0 8 * * *"  # Run AFTER all AgendaCenter sources
    params:
      feed_url: "https://www.mytwinsburg.com/common/modules/iCalendar/iCalendar.aspx?catID=14&feed=calendar"
      civic_only: true  # Only include government/civic meetings, not community events
    rate_limit:
      delay_seconds: 1
      max_concurrent: 1

