  # PROVIDES: Capital Improvement Board meeting agendas, minutes  
  # DATA: Infrastructure projects, capital budgeting, major expenditures
  - name: "Capital Improvement Board"
    driver: "civic_plus"
    enabled: true
    schedule: "0 7 * * *"
    params:
