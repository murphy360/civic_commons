# Civic Commons Docker Compose
# 
# Services:
#   - db: PostgreSQL database
#   - commons-worker: Scraper/worker service
#   - commons-mcp: MCP server for LLM access
#   - commons-web: Public-facing Next.js app
#   - commons-admin: Admin dashboard Next.js app
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up db              # Start only database
#   docker-compose logs -f worker     # Follow worker logs
#   docker-compose down               # Stop all services

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  db:
    image: postgres:15-alpine
    container_name: civic_commons_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civic_commons}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-civic_commons}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civic_commons}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civic_network

  # ===========================================================================
  # Scraper/Worker Service
  # ===========================================================================
  commons-worker:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: civic_commons_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-civic_commons}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-civic_commons}
      CONFIG_DIR: /app/configs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCRAPER_INTERVAL: ${SCRAPER_INTERVAL:-3600}
    volumes:
      - ./configs:/app/configs:ro
      - scraper_data:/data
    networks:
      - civic_network

  # ===========================================================================
  # MCP Server
  # ===========================================================================
  commons-mcp:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: civic_commons_mcp
    restart: "no"  # MCP uses stdio transport, runs on-demand
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MCP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-civic_commons}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-civic_commons}
      MCP_API_KEY: ${MCP_API_KEY:?MCP_API_KEY is required}
      MCP_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - civic_network

  # ===========================================================================
  # Public Web Application
  # ===========================================================================
  commons-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: civic_commons_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-civic_commons}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-civic_commons}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Civic Commons}
    networks:
      - civic_network

  # ===========================================================================
  # Admin Dashboard
  # ===========================================================================
  commons-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: civic_commons_admin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-civic_commons}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-civic_commons}
      NEXTAUTH_URL: ${ADMIN_NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    networks:
      - civic_network

# =============================================================================
# Networks
# =============================================================================
networks:
  civic_network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  scraper_data:
    driver: local
