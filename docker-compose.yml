# Civic Commons Docker Compose
# 
# Services:
#   - db: PostgreSQL database
#   - commons-worker: Scraper/worker service
#   - commons-mcp: MCP server for LLM access
#   - commons-web: Public-facing Next.js app
#   - commons-admin: Admin dashboard Next.js app
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up db              # Start only database
#   docker-compose logs -f worker     # Follow worker logs
#   docker-compose down               # Stop all services

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  db:
    image: postgres:15-alpine
    container_name: civic_commons_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civic_commons}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-civic_commons}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./scripts/migrations:/scripts/migrations:ro
    healthcheck:
      # Use POSTGRES_USER env var set inside container, not compose interpolation
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civic_network

  # ===========================================================================
  # Scraper/Worker Service
  # ===========================================================================
  commons-scraper:
    build:
      context: ./server
      dockerfile: workers/scraper/Dockerfile
    container_name: civic_commons_scraper
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      commons-mcp:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-civic_commons}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-civic_commons}
      MCP_URL: http://commons-mcp:8000
      CONFIG_DIR: /app/configs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCRAPER_INTERVAL: ${SCRAPER_INTERVAL:-3600}
      RUN_ON_STARTUP: ${RUN_ON_STARTUP:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_QUEUE_INTERVAL_SECONDS: ${AI_QUEUE_INTERVAL_SECONDS:-30}
      AI_QUEUE_BATCH_SIZE: ${AI_QUEUE_BATCH_SIZE:-1}
      AI_SUMMARY_MAX_AGE_DAYS: ${AI_SUMMARY_MAX_AGE_DAYS:-0}
    volumes:
      - ./configs:/app/configs:ro
      - scraper_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - civic_network

  # ===========================================================================
  # MCP Service (Tool hosting via HTTP/SSE)
  # ===========================================================================
  commons-mcp:
    build:
      context: ./server
      dockerfile: services/mcp/Dockerfile
    container_name: civic_commons_mcp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-civic_commons}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-civic_commons}
      MCP_API_KEY: ${MCP_API_KEY:?MCP_API_KEY is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: uvicorn services.mcp.sse_server:app --host 0.0.0.0 --port 8000 --log-level info
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - civic_network

  # ===========================================================================
  # Cascade Service (Background worker for summary regeneration)
  # ===========================================================================
  commons-cascade:
    build:
      context: ./server
      dockerfile: workers/cascade/Dockerfile
    container_name: civic_commons_cascade
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      commons-mcp:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-civic_commons}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-civic_commons}
      MCP_URL: http://commons-mcp:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - civic_network

  # ===========================================================================
  # API Service (HTTP for web frontend chat)
  # ===========================================================================
  commons-api:
    build:
      context: ./server
      dockerfile: services/api/Dockerfile
    container_name: civic_commons_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8089}:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-civic_commons}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-civic_commons}
      MCP_API_KEY: ${MCP_API_KEY:?MCP_API_KEY is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      MCP_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_CONFIG: ${DEFAULT_CONFIG:-twinsburg.yaml}
    volumes:
      - ./configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - civic_network

  # ===========================================================================
  # Public Web Application
  # ===========================================================================
  commons-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: civic_commons_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      commons-api:
        condition: service_started
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-civic_commons}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-civic_commons}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Civic Commons}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      DOCUMENT_STORAGE_DIR: /data/documents
    volumes:
      - scraper_data:/data:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - civic_network

  # ===========================================================================
  # Admin Dashboard
  # ===========================================================================
  commons-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: civic_commons_admin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-civic_commons}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-civic_commons}
      NEXTAUTH_URL: ${ADMIN_NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      AI_QUEUE_INTERVAL_SECONDS: ${AI_QUEUE_INTERVAL_SECONDS:-30}
      AI_QUEUE_BATCH_SIZE: ${AI_QUEUE_BATCH_SIZE:-1}
      AI_SUMMARY_MAX_AGE_DAYS: ${AI_SUMMARY_MAX_AGE_DAYS:-0}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - civic_network

# =============================================================================
# Networks
# =============================================================================
networks:
  civic_network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  scraper_data:
    driver: local
